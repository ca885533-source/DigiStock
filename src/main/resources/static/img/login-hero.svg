      <stop offset="0" stop-color="#6C4DF6"/>
      <stop offset="1" stop-color="#00B8A9"/>
    </linearGradient>
  </defs>
  <rect width="480" height="400" fill="url(#bg)"/>
  <circle cx="400" cy="70" r="90" fill="#fff" fill-opacity=".10"/>
  <circle cx="60" cy="350" r="110" fill="#fff" fill-opacity=".08"/>
  <circle cx="420" cy="330" r="40" fill="#FFC857" fill-opacity=".85"/>

  <!-- estante -->
  <rect x="60" y="150" width="190" height="10" rx="5" fill="#fff" fill-opacity=".85"/>
  <rect x="60" y="250" width="190" height="10" rx="5" fill="#fff" fill-opacity=".85"/>
  <rect x="60" y="350" width="190" height="10" rx="5" fill="#fff" fill-opacity=".85"/>

  <!-- cajas fila 1 -->
  <rect x="72" y="100" width="48" height="50" rx="6" fill="#FF7A59"/>
  <rect x="72" y="118" width="48" height="8" fill="#fff" fill-opacity=".45"/>
  <rect x="128" y="86" width="56" height="64" rx="6" fill="#FFC857"/>
  <rect x="128" y="108" width="56" height="8" fill="#fff" fill-opacity=".55"/>
  <rect x="192" y="110" width="46" height="40" rx="6" fill="#fff"/>
