  <!-- cajas fila 2 -->
  <rect x="76" y="200" width="60" height="50" rx="6" fill="#fff"/>
  <rect x="76" y="218" width="60" height="8" fill="#00B8A9" fill-opacity=".55"/>
  <rect x="146" y="186" width="44" height="64" rx="6" fill="#FF7A59"/>
  <rect x="146" y="208" width="44" height="8" fill="#fff" fill-opacity=".45"/>
  <rect x="198" y="206" width="44" height="44" rx="6" fill="#FFC857"/>
  <rect x="198" y="222" width="44" height="7" fill="#fff" fill-opacity=".55"/>

  <!-- cajas fila 3 -->
  <rect x="72" y="296" width="70" height="54" rx="6" fill="#FFC857"/>
