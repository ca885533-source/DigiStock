    <rect x="303" y="148" width="70" height="8" rx="4" fill="#d9dbe8"/>
    <rect x="303" y="168" width="114" height="8" rx="4" fill="#d9dbe8"/>
    <rect x="303" y="188" width="96" height="8" rx="4" fill="#d9dbe8"/>
