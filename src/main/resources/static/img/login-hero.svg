    <rect x="303" y="238" width="114" height="28" rx="8" fill="#00B8A9"/>
    <text x="360" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">TOTAL</text>
