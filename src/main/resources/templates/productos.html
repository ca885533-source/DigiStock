<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>DigiStock - Inventario</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <div class="contenedor-ancho">
        <h1>Inventario de productos</h1>
        <a class="enlace" th:href="@{/dashboard}">&larr; Volver al panel</a>

        <!-- Solo ADMINISTRADOR y ALMACENISTA pueden agregar productos nuevos -->
        <div sec:authorize="hasAnyRole('ADMINISTRADOR','ALMACENISTA')">
            <a th:href="@{/productos/nuevo}">
                <button type="button">+ Nuevo producto</button>
            </a>
        </div>

        <!-- Mensaje cuando todavia no hay productos registrados -->
        <p th:if="${#lists.isEmpty(productos)}">Todavia no hay productos registrados.</p>

        <table th:unless="${#lists.isEmpty(productos)}">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock disponible</th>
                    <th sec:authorize="hasAnyRole('ADMINISTRADOR','ALMACENISTA')">Accion</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${productos}">
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${'$' + #numbers.formatDecimal(p.precio, 0, 'POINT', 0, 'COMMA')}"></td>
                    <td>
                        <!-- Insignia roja cuando el stock esta bajo (5 unidades o menos) -->
                        <span th:class="${p.stockDisponible <= 5} ? 'badge badge-anulada' : 'badge badge-exito'"
                              th:text="${p.stockDisponible}"></span>
                    </td>
                    <td sec:authorize="hasAnyRole('ADMINISTRADOR','ALMACENISTA')">
                        <a class="enlace" th:href="@{'/productos/' + ${p.id} + '/editar'}">Editar</a>
                        <form th:action="@{'/productos/' + ${p.id} + '/eliminar'}" method="post" style="display:inline">
                            <button type="submit">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
