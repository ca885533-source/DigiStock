# Nombre de la aplicacion
spring.application.name=DigiStock

# Conexion a MongoDB local. Ajustar host/puerto/credenciales segun el entorno.
spring.data.mongodb.uri=mongodb://localhost:27017/digistock

# Puerto en el que corre la aplicacion web
server.port=8080

# Muestra mensajes de Thymeleaf mas claros durante el desarrollo
spring.thymeleaf.cache=false

# Nivel de log util para depurar seguridad durante las pruebas
logging.level.org.springframework.security=INFO
